name: Build EffectCraft iOS · split selected layers

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effectcraft-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      IPHONEOS_DEPLOYMENT_TARGET: '17.0'
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      CARGO_BUILD_JOBS: '3'
