      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'effectcraft -> target'
          shared-key: ios-device-rust-1.95
          cache-on-failure: true
      - name: Validate packaging and formatting (host tests already passed locally)
        run: |
          cargo fmt --all -- --check
          python3 -m unittest discover -s packaging/ios -p 'test_*.py'
      - name: Compile the native app and package the IPA
        run: bash packaging/ios/build.sh --unsigned
      - name: Download on iPhone and sign with your own tool
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-iOS-windows-unsigned
          path: |
            effectcraft/target/ios/EffectCraft-unsigned.ipa
            effectcraft/target/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
