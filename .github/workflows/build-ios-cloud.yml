      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'effectcraft -> target'
          shared-key: ios-device-rust-1.95
          cache-on-failure: true
      - name: Validate packaging and formatting (host tests already passed locally)
        run: |
          cargo fmt --all -- --check
          python3 -m unittest discover -s packaging/ios -p 'test_*.py'
      - name: Test native protocol client and synthetic host adapter
        run: |
          node apps/effectcraft-ae-bridge/tests/host-fixture.cjs
          node apps/effectcraft-ae-bridge/tests/worker-fixture.cjs
          python3 - <<'PY'
          import pathlib, shutil
          root=pathlib.Path('/tmp/effectcraft-native-pc-client-check')
          (root/'src').mkdir(parents=True,exist_ok=True)
          shutil.copyfile('apps/effectcraft-ios/src/remote_client.rs',root/'src/lib.rs')
          (root/'Cargo.toml').write_text('[package]\nname = "effectcraft-native-pc-client-check"\nversion = "0.1.0"\nedition = "2024"\n[workspace]\n[dependencies]\nserde_json = "=1.0.151"\ntempfile = "=3.27.0"\n',encoding='utf-8')
          PY
          cargo test --manifest-path /tmp/effectcraft-native-pc-client-check/Cargo.toml
      - name: Compile the native app and package the IPA
        run: bash packaging/ios/build.sh --unsigned
      - name: Download on iPhone and sign with your own tool
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-iOS-Sapphire-PC-unsigned
          path: |
            effectcraft/target/ios/EffectCraft-unsigned.ipa
            effectcraft/target/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

