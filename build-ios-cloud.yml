  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      IPHONEOS_DEPLOYMENT_TARGET: '17.0'
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      CARGO_BUILD_JOBS: '3'
